on:
  push:
    branches: [main, develop]

jobs:
  check:
    name: Check things
    runs-on: ubuntu-latest
    steps:
      - name: print
        run: |
          pwd
          whoami
          ls -al
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
    - name: build and install node project
      run: |
        npm install
        npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: run node tests
        run: |
          npm test
